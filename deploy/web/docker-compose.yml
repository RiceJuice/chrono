# Chrono Web-App auf dem Homeserver.
# Ordnerstruktur auf dem Server:
#   chrono-web/
#     docker-compose.yml
#     nginx.conf
#     site/            <- Inhalt von build/web (index.html, main.dart.js, ...)
#
# Start:  docker compose up -d
# Danach erreichbar unter http://<server-ip>:8080
# Fürs iPhone (PWA) ist HTTPS nötig -> Reverse-Proxy davor (siehe README.md).
services:
  chrono-web:
    image: nginx:1.27-alpine
    container_name: chrono-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
