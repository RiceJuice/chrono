# nginx-Konfiguration für die Chrono-Web-App (Flutter Web / PWA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebAssembly (sqlite3.wasm, CanvasKit/Skwasm) braucht den richtigen MIME-Typ
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Einstiegsdateien nie cachen, damit Updates sofort ankommen
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Alles andere darf gecacht werden
    location / {
        add_header Cache-Control "public, max-age=3600";
        # SPA-Fallback: unbekannte Pfade landen in der App (go_router)
        try_files $uri $uri/ /index.html;
    }
}
