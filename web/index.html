<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    Base-Pfad: wird von `flutter build web --base-href /pfad/` ersetzt.
    Muss mit "/" beginnen und enden.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chrono – dein persönlicher All-in-One-Kalender.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">

  <!-- iOS: als App zum Home-Bildschirm hinzufügen (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chrono">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chrono</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #111827; } }
  </style>
</head>
<body>
  <script>
    // Safari/iOS: PowerSync-Sync im SharedWorker funktioniert dort nicht zuverlaessig
    // (Klassen/Termine kommen nicht an). Ohne SharedWorker nutzt PowerSync den
    // Sync direkt im Tab. Testen: ?sw=1 erzwingt SharedWorker, ?sw=0 schaltet ihn ab.
    (function () {
      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|Android/.test(ua);
      var param = new URLSearchParams(location.search).get('sw');
      var disable = param === '0' || (param !== '1' && (isIOS || isSafari));
      if (disable) { try { delete window.SharedWorker; } catch (e) {} }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
